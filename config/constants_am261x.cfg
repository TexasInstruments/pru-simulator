# AM261x PRU-ICSSM constant table (C0-C31 base addresses).
# Source: AM261x TRM SPRUJB6B (Nov 2024, rev May 2025), section 7.3.5.2.1,
# Table 7-40 "PRU0/1 Constant Table", pp. 370-371.
# Cross-checked against open-pru source/include/am261x/cslr_icss_m.h.
# AM263x has the same ICSS-M and reads this file too (no constants_am263x.cfg).
#
# Left out (read as 0), because the TRM gives no single fixed value:
#   c10         TRM value reads "RSERVED" (no address)
#   c11, c22    per-core: PRU0 and PRU1 see different values (Table 7-40)
#   c12-c14     RESERVED, no address
#   c24-c31     partially programmable through PRU CTRL registers; the TRM
#               text gives the form (e.g. 00nn_nn00h) but no reset value
[constants]
c0  = 0x00020000
c1  = 0x0002F000
c2  = 0x0002F100
c3  = 0x00030000
c4  = 0x00026000
c5  = 0x00026100
c6  = 0x00020200
c7  = 0x00028000
c8  = 0x0002E100
c9  = 0x00033000
# c15-c20, c23: marked RESERVED in the TRM, but a value is given
c15 = 0x60000000
c16 = 0x70000000
c17 = 0x80000000
c18 = 0x90000000
c19 = 0xA0000000
c20 = 0xB0000000
c21 = 0x00032400
c23 = 0xC0000000
