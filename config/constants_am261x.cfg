# AM261x PRU-ICSSM constant table (C0-C31 base addresses).
# Source: AM261x TRM SPRUJB6B (Nov 2024, rev May 2025), section 7.3.5.2.1,
# Table 7-40 "PRU0/1 Constant Table", pp. 370-371.
# Cross-checked against open-pru source/include/am261x/cslr_icss_m.h.
# AM263x has the same ICSS-M; constants_am263x.cfg carries identical values.
#
# c24-c31 are not listed: they follow the per-core CTRL registers CTBIR0/1
# and CTPPR0/1 (see constants_am243x.cfg), all 0 at reset, so c28 is 0 until
# firmware programs CTPPR0. Read on an LP-AM261 with CTPPR0 = 0x100 left over
# from earlier use (c28 = 0x10000); the power-on value was not measured.
#
# c11, c22    per-core: PRU0 and PRU1 see different values (Table 7-40)
# c10, c12-c14  RESERVED in the TRM. Silicon (ICTE direct read, CCS register
#               view, both PRUs) holds pointers: c10 0x2A000 on PRU0 and
#               0x2A200 on PRU1, c12 0x27000, c13 0x2C000, c14 0x24800. The
#               window behind each reads zero (no fault). The simulator shows
#               the pointers and maps the reserved ranges as read-as-zero
#               windows (mem/icssm_absent.py), so an LBCO through them returns
#               zeros. Writes are ignored and logged once; a store was dropped
#               on silicon at 0x27000, 0x2A000 and 0x2C000, the rest is not
#               measured.
[constants]
c0  = 0x00020000
c1  = 0x0002F000
c2  = 0x0002F100
c3  = 0x00030000
c4  = 0x00026000
c5  = 0x00026100
c6  = 0x00020200
c7  = 0x00028000
c8  = 0x0002E100
c9  = 0x00033000
# c10 is per-core (simulator.py). c12-c14: pointer present, window reads zero.
c12 = 0x00027000
c13 = 0x0002C000
c14 = 0x00024800
# c15-c20, c23: marked RESERVED in the TRM, but a value is given
c15 = 0x60000000
c16 = 0x70000000
c17 = 0x80000000
c18 = 0x90000000
c19 = 0xA0000000
c20 = 0xB0000000
c21 = 0x00032400
c23 = 0xC0000000
