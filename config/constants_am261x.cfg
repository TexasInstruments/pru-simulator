# AM261x PRU-ICSSM constant table (C0-C31 base addresses).
# Source: AM261x TRM SPRUJB6B (Nov 2024, rev May 2025), section 7.3.5.2.1,
# Table 7-40 "PRU0/1 Constant Table", pp. 370-371.
# Cross-checked against open-pru source/include/am261x/cslr_icss_m.h.
# AM263x has the same ICSS-M and reads this file too (no constants_am263x.cfg).
#
# Left out (read as 0), because the TRM gives no single fixed value or the
# simulator has no matching model:
#   c10         TRM value reads "RSERVED" (no address). Silicon as found on an
#               LP-AM261: the table holds a non-zero pointer (0x2A000 on PRU0,
#               0x2A200 on PRU1) but the window behind it reads zero. The
#               simulator has no "pointer present, window reads zero" model, so
#               the entry is left absent (0). An LBCO through an absent entry
#               reads the core's own DRAM at local 0, not zeros: this differs
#               from silicon and firmware must not rely on C10 here.
#   c11, c22    per-core: PRU0 and PRU1 see different values (Table 7-40)
#   c12-c14     RESERVED in the TRM. Silicon as found: pointers 0x27000, 0x2C000
#               and 0x24800 (same for both PRUs), window behind each reads zero.
#               Left absent for the same reason as c10, with the same
#               own-DRAM-instead-of-zero difference.
#   c24         own DRAM, local 0x0: absent reads as 0, the same value
#   c28         programmable through CTPPR0; as found 0x10000 on an LP-AM261
#               (CTPPR0 = 0x100 left by earlier use), power-on value unresolved.
#               Left at 0 here: the as-found value is not a power-on value.
# c29-c31 are listed below as found.
[constants]
c0  = 0x00020000
c1  = 0x0002F000
c2  = 0x0002F100
c3  = 0x00030000
c4  = 0x00026000
c5  = 0x00026100
c6  = 0x00020200
c7  = 0x00028000
c8  = 0x0002E100
c9  = 0x00033000
# c15-c20, c23: marked RESERVED in the TRM, but a value is given
c15 = 0x60000000
c16 = 0x70000000
c17 = 0x80000000
c18 = 0x90000000
c19 = 0xA0000000
c20 = 0xB0000000
c21 = 0x00032400
c23 = 0xC0000000
# c25-c27: the TRM gives the form (2n00h, 2En00h, 32n00h); with the CTBIR
# fields at 0 they read the other core's DRAM and the IEP0 / 0x32000 windows
c25 = 0x00002000
c26 = 0x0002E000
c27 = 0x00032000
# c29-c31: as found 0xD0000000, 0xE0000000, 0xF0000000 (form 0xD0000000 | ptr << 8
# with the pointer fields at 0), not 0 as the TRM text suggests. Static
# as-found values, like c25-c27.
c29 = 0xD0000000
c30 = 0xE0000000
c31 = 0xF0000000
