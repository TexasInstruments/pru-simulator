[constants]
; TRM SPRUIM2J (AM64x/AM243x) section 6.4.5.2.1 Table 6-65 "PRU0/1 Constant
; Table" (printed pp. 581-582). Values are PRU0's local view. c1-c9 and c21 were
; read back with LBCO on an LP-AM243 (ICSSG0) and equal the ICSS-local window at
; the listed address; c16 reads the same data as the 0x70000000 window. c12-c15,
; c17-c20 and c23 read zero on that board, as does the TRM-listed window, so
; those are the TRM values, consistent but not identified by a read.
; c26 = 0x2E000 and c27 = 0x32000 match the 0x2En00 / 0x32n00 forms with n = 0.
; c10, c11 and c22 are per-core and set in simulator.py.
; c28: as found 0 on an LP-AM243 (CTPPR0 = 0); the power-on value is unresolved.
; 0x10000 (the TRM CTPPR0 form with the field at 0x100) is kept as the simulator
; default so firmware that does not program CTPPR0 still reaches shared RAM; it
; is NOT confirmed by silicon. An LP-AM261 read showed CTPPR0 = 0x100 left over
; from earlier use, so neither as-found state is a power-on state.
; c29-c31: as found 0xD0000000, 0xE0000000, 0xF0000000 (pointer fields at 0).
c0  = 0x00020000
c1  = 0x0002F000
c2  = 0x0002F100
c3  = 0x00030000
c4  = 0x00026000
c5  = 0x00026100
c6  = 0x00020200
c7  = 0x00028000
c8  = 0x0002E100
c9  = 0x00033000
c10 = 0x48318000
c11 = 0x48022000
c12 = 0x00027000
c13 = 0x0002C000
c14 = 0x00024800
c15 = 0x60000000
c16 = 0x70000000
c17 = 0x80000000
c18 = 0x90000000
c19 = 0xA0000000
c20 = 0xB0000000
c21 = 0x00032400
c22 = 0x00032400
c23 = 0xC0000000
c24 = 0x00000000
c25 = 0x00002000
c26 = 0x0002E000
c27 = 0x00032000
c28 = 0x00010000
c29 = 0xD0000000
c30 = 0xE0000000
c31 = 0xF0000000
