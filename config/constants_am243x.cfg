[constants]
; TRM SPRUIM2J (AM64x/AM243x) section 6.4.5.2.1 Table 6-65 "PRU0/1 Constant
; Table" (printed pp. 581-582). Values are PRU0's local view. c1-c9 and c21 were
; read back with LBCO on an LP-AM243 (ICSSG0) and equal the ICSS-local window at
; the listed address; c16 reads the same data as the 0x70000000 window. c12-c15,
; c17-c20 and c23 read zero on that board, as does the TRM-listed window, so
; those are the TRM values, consistent but not identified by a read.
; c10, c11 and c22 are per-core and set in simulator.py.
; c24-c31 are not listed: they follow the per-core CTRL registers CTBIR0/1
; (+0x20, +0x24) and CTPPR0/1 (+0x28, +0x2C), all 0 at reset (mem/constant_table.py).
; Silicon, both boards: C24 = CTBIR0[7:0]<<8, C25 = 0x2000|CTBIR0[23:16]<<8,
; C26 = 0x2E000|CTBIR1[7:0]<<8, C27 = 0x32000|CTBIR1[23:16]<<8,
; C28 = CTPPR0[15:0]<<8, C29 = 0xD0000000|CTPPR0[31:16]<<8, C30 = 0xE0000000|
; CTPPR1[15:0]<<8, C31 = 0xF0000000|CTPPR1[31:16]<<8. So C28 is 0 until firmware
; programs CTPPR0 (blk_ptr = 0x100 gives 0x10000, Shared RAM). The power-on value
; of the registers was not measured (boards were not power cycled).
c0  = 0x00020000
c1  = 0x0002F000
c2  = 0x0002F100
c3  = 0x00030000
c4  = 0x00026000
c5  = 0x00026100
c6  = 0x00020200
c7  = 0x00028000
c8  = 0x0002E100
c9  = 0x00033000
c10 = 0x48318000
c11 = 0x48022000
c12 = 0x00027000
c13 = 0x0002C000
c14 = 0x00024800
c15 = 0x60000000
c16 = 0x70000000
c17 = 0x80000000
c18 = 0x90000000
c19 = 0xA0000000
c20 = 0xB0000000
c21 = 0x00032400
c22 = 0x00032400
c23 = 0xC0000000
