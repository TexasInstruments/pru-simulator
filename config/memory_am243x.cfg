[device]
target = AM243x
core_version = V4
; IEP0 clock (ICSSG_IEP_CLK) in MHz, independent of the PRU clocks.
; Defaults to pru_clock_mhz when omitted.
; iep_clock_mhz = 250

[DRAM0]
base = 0x00000000
size = 0x2000
read_latency = 2
write_latency = 1
jitter = 0

[DRAM1]
base = 0x00002000
size = 0x2000
read_latency = 2
write_latency = 1
jitter = 0

[ICSS_SHARED]
base = 0x00010000
size = 0x10000
read_latency = 2
write_latency = 1
jitter = 0

[MS_RAM]
base = 0x80000000
size = 0x10000
read_latency = 40
write_latency = 1
jitter = 10
