[device]
target = AM243x
core_version = V4
; LP-AM243 PRU0 and PRU1 CYCLE read: 6 cycles = 1 instruction + 5 stalls (#70).
; Applied to both PRU CTRL windows; only the CYCLE register was measured, not
; the other CTRL registers. Without this key a CTRL window costs 3 cycles.
pru_ctrl_read_latency = 5
; IEP0 clock (ICSSG_IEP_CLK) in MHz, independent of the PRU clocks.
; Defaults independently to 200 MHz when omitted.
; iep_clock_mhz = 250

[DRAM0]
base = 0x00000000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[DRAM1]
base = 0x00002000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[ICSS_SHARED]
base = 0x00010000
size = 0x10000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

; MS_RAM measured on LP-AM243 (ICSSG0 PRU0, 2026-10-15): LBBO 4/16/32/64 B = 21/24/28/36
; cycles, deterministic when the other PRU is idle; stores cost the same as DMEM.
; LBBO cost = 1 + read_latency + (words-1) * per_word_latency (per_word_latency defaults to 1).
; PRU0 reads up to 64 B crossing a 64 B line cost extra stalls = 13 - W1//2,
; W1 = touched 32-bit words in the first line. This is an empirical fit of 17
; LP-AM243 points (issue #69), not a derived hardware cause: 13 is the fit
; constant (line_cross_fit), valid for 64 B lines and per_word_latency = 1.
; Within a line timing is unchanged, including unaligned reads. Straddling
; stores, PRU1/RTU reads, larger bursts and AM261x remain unmodelled.
[MS_RAM]
base = 0x70000000
size = 0x200000
read_latency = 20
line_bytes = 64
line_cross_fit = 13
line_readers = PRU0
write_latency = 1
jitter = 0
