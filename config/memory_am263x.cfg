; PRU0/PRU1 CTRL windows (C11): a CYCLE read costs 4 cycles (1 instruction + 3
; stalls), measured on LP-AM261 ICSSM0 (register level). The ICSS-M RTL is the
; same on AM263x, whose silicon was not measured directly. AM26x has no RTU cores.
[device]
target = AM263x
core_version = V4
pru_ctrl_read_latency = 3
; ICSSG-only blocks (RTU_PRU, TX_PRU, TM_CFG, PA_STATS, IEP1, CFG 0x130..0x16C) are
; absent on ICSS-M. Default: reads return 0, writes are ignored (as on silicon).
; icssg_only_blocks = strict   raises on such an access instead; docs/icssm_absent_blocks.md.

[DRAM0]
base = 0x00000000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[DRAM1]
base = 0x00002000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[ICSS_SHARED]
base = 0x00010000
size = 0x8000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[MS_RAM]
base = 0x80000000
size = 0x10000
read_latency = 40
write_latency = 1
jitter = 10
