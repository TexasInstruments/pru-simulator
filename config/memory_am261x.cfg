; LP-AM261 (AM2612) ICSSM0 PRU, silicon-calibrated 2026-10-11.
; MS_RAM: LBBO cost = 1 + read_latency + (words-1) * per_word_latency
;   = 12 + 10 cycles per 32-bit word -> 22 / 52 / 92 cycles for 4 / 16 / 32 B.
; DRAM0, DRAM1 and ICSS_SHARED measured equal to own-DRAM (3 / 6 cycles for 4 / 16 B).
; A store to them that starts misaligned and spans 2+ words costs 2 + W, not
; 1 + W (#77, LP-AM261 2026-10-19); MS_RAM stores have no such penalty.
; PRU0/PRU1 CTRL windows (C11): a CYCLE read costs 4 cycles (1 instruction + 3
; stalls), measured on LP-AM261 ICSSM0 PRU0 and PRU1 (register level). Applied to
; both windows; other CTRL registers were not measured. AM26x has no RTU cores.
[device]
target = AM261x
core_version = V4
pru_ctrl_read_latency = 3
; ICSSG-only blocks (RTU_PRU, TX_PRU, TM_CFG, PA_STATS, IEP1, CFG 0x130..0x16C) are
; absent on ICSS-M. Default: reads return 0, writes are ignored (as on silicon).
; icssg_only_blocks = strict   raises on such an access instead; docs/icssm_absent_blocks.md.

[DRAM0]
base = 0x00000000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[DRAM1]
base = 0x00002000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[ICSS_SHARED]
base = 0x00010000
size = 0x8000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[MS_RAM]
base = 0x70000000
size = 0x200000
read_latency = 21
write_latency = 1
jitter = 0
per_word_latency = 10
