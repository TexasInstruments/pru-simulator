; LP-AM261 (AM2612) ICSSM0 PRU, silicon-calibrated 2026-10-11.
; MS_RAM: LBBO cost = 1 + read_latency + (words-1) * per_word_latency
;   = 12 + 10 cycles per 32-bit word -> 22 / 52 / 92 cycles for 4 / 16 / 32 B.
; DRAM0, DRAM1 and ICSS_SHARED measured equal to own-DRAM (3 / 6 cycles for 4 / 16 B).
[device]
target = AM261x
core_version = V3

[DRAM0]
base = 0x00000000
size = 0x2000
read_latency = 2
write_latency = 1
jitter = 0

[DRAM1]
base = 0x00002000
size = 0x2000
read_latency = 2
write_latency = 1
jitter = 0

[ICSS_SHARED]
base = 0x00010000
size = 0x8000
read_latency = 2
write_latency = 1
jitter = 0

[MS_RAM]
base = 0x70000000
size = 0x200000
read_latency = 21
write_latency = 1
jitter = 0
per_word_latency = 10
