[device]
target = AM243x
core_version = V4
pru_clock_mhz = 250
pru1_clock_mhz = 250
; Read cost of every CTRL window that does not set its own read_latency:
; 5 stalls (6 cycles), the LP-AM243 PRU0/PRU1 CYCLE read (#70).
pru_ctrl_read_latency = 5

[DRAM0]
base = 0x00000000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[DRAM1]
base = 0x00002000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[ICSS_SHARED]
base = 0x00010000
size = 0x10000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

; MS_RAM measured on LP-AM243 (ICSSG0 PRU0, 2026-10-15): LBBO 4/16/32/64 B = 21/24/28/36 cycles.
; PRU0 reads up to 64 B crossing a 64 B line: extra stalls = 13 - W1//2 (empirical
; fit of 17 LP-AM243 points, issue #69; see config/memory_am243x.cfg).
[MS_RAM]
base = 0x70000000
size = 0x80000
read_latency = 20
line_bytes = 64
line_cross_fit = 13
line_readers = pru0
write_latency = 1
jitter = 0

; PRU0 CTRL window. read_latency = 5 (6 cycles) is the LP-AM243 CYCLE read
; (issue #70); only that register was measured. A config's own value wins.
[ICSS_CFG]
base = 0x00022000
size = 0x100
read_latency = 5
write_latency = 1
jitter = 0

; CTRL windows of the other ICSSG cores (SPRUIM2J Table 6-63). They take
; [device] pru_ctrl_read_latency. PRU1 was measured (#70); the RTU_PRU and
; TX_PRU windows were not and are assumed to cost the same. CYCLE follows
; PRU1, RTU_PRU0 and RTU_PRU1. TX_PRU cores are not simulated, so their
; windows are plain storage. On an ICSS-M target the RTU_PRU and TX_PRU
; windows are ignored: those blocks are absent there.
[PRU1_CTRL]
base = 0x00024000
size = 0x100
write_latency = 1
jitter = 0

[RTU_PRU0_CTRL]
base = 0x00023000
size = 0x100
write_latency = 1
jitter = 0

[RTU_PRU1_CTRL]
base = 0x00023800
size = 0x100
write_latency = 1
jitter = 0

[TX_PRU0_CTRL]
base = 0x00025000
size = 0x100
write_latency = 1
jitter = 0

[TX_PRU1_CTRL]
base = 0x00025800
size = 0x100
write_latency = 1
jitter = 0
