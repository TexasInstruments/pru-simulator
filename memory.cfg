[device]
target = AM243x
core_version = V4
pru_clock_mhz = 250
pru1_clock_mhz = 250

[DRAM0]
base = 0x00000000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[DRAM1]
base = 0x00002000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[ICSS_SHARED]
base = 0x00010000
size = 0x10000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

; MS_RAM measured on LP-AM243 (ICSSG0 PRU0, 2026-10-15): LBBO 4/16/32/64 B = 21/24/28/36 cycles.
[MS_RAM]
base = 0x70000000
size = 0x80000
read_latency = 20
write_latency = 1
jitter = 0

; PRU0 CTRL window. read_latency = 5 (6 cycles) is the LP-AM243 CYCLE read
; (issue #70); only that register was measured. A config's own value wins.
[ICSS_CFG]
base = 0x00022000
size = 0x100
read_latency = 5
write_latency = 1
jitter = 0
