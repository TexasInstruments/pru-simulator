[device]
target = AM243x
core_version = V4
pru_clock_mhz = 250
pru1_clock_mhz = 250

[DRAM0]
base = 0x00000000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[DRAM1]
base = 0x00002000
size = 0x2000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

[ICSS_SHARED]
base = 0x00010000
size = 0x10000
read_latency = 2
write_latency = 1
misaligned_write_penalty = 1
jitter = 0

; MS_RAM measured on LP-AM243 (ICSSG0 PRU0, 2026-10-15): LBBO 4/16/32/64 B = 21/24/28/36 cycles.
; PRU0 reads up to 64 B crossing a 64 B line: extra stalls = 13 - W1//2 (empirical
; fit of 17 LP-AM243 points, issue #69; see config/memory_am243x.cfg).
[MS_RAM]
base = 0x70000000
size = 0x80000
read_latency = 20
line_bytes = 64
line_cross_fit = 13
line_readers = pru0
write_latency = 1
jitter = 0

[ICSS_CFG]
base = 0x00022000
size = 0x100
read_latency = 2
write_latency = 1
jitter = 0
