<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">pif_eth_100 data path at 100 Mbaud</title>
<desc id="d">Block diagram. PRU0 fills a 200 byte PRNG payload, computes CRC-32 on the accelerator, encodes 8b/10b with a 256-entry LUT, packs a 4-deep TX FIFO and serialises at 100 Mbaud (TXCFG 0x00020010). The loopback wire feeds PRU1, which samples at exact 2x (RXCFG 0x0000801F), captures raw samples in real time, then decodes, checks CRC-32 and bit errors and writes a stats block.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect width="960" height="690" fill="#ffffff"/>
<text x="480.0" y="26.0" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">pif_eth_100 data path: PRU0 TX, loopback wire, PRU1 RX</text>
<text x="480.0" y="44.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="italic" fill="#555555">numbers are simulator results, not silicon</text>
<rect x="20" y="58" width="920" height="200" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="30.0" y="73.0" font-size="12" text-anchor="start" font-weight="bold" font-style="normal" fill="#0072B2">PRU0 (TX core, 300 MHz)</text>
<rect x="36" y="82" width="155" height="132" rx="6" fill="#f4f8fc" stroke="#1f4e79" stroke-width="1.5"/>
<text x="113.5" y="122.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">PRNG fill</text>
<text x="113.5" y="136.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">200 B xorshift32</text>
<text x="113.5" y="150.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">payload in DRAM0</text>
<text x="113.5" y="164.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">core buffer</text>
<circle cx="52" cy="98" r="11" fill="#1f4e79"/><text x="52.0" y="102.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">1</text>
<rect x="219" y="82" width="155" height="132" rx="6" fill="#f4f8fc" stroke="#1f4e79" stroke-width="1.5"/>
<text x="296.5" y="122.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">CRC-32</text>
<text x="296.5" y="136.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">CRC16/32 broadside</text>
<text x="296.5" y="150.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">accelerator</text>
<text x="296.5" y="164.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">+4 B FCS</text>
<circle cx="235" cy="98" r="11" fill="#1f4e79"/><text x="235.0" y="102.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">2</text>
<line x1="191" y1="155.0" x2="217" y2="155.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="402" y="82" width="155" height="132" rx="6" fill="#f4f8fc" stroke="#1f4e79" stroke-width="1.5"/>
<text x="479.5" y="122.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">8b/10b encode</text>
<text x="479.5" y="136.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">256-entry LUT</text>
<text x="479.5" y="150.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">in DRAM0, running</text>
<text x="479.5" y="164.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">disparity</text>
<circle cx="418" cy="98" r="11" fill="#1f4e79"/><text x="418.0" y="102.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">3</text>
<line x1="374" y1="155.0" x2="400" y2="155.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="585" y="82" width="155" height="132" rx="6" fill="#f4f8fc" stroke="#1f4e79" stroke-width="1.5"/>
<text x="662.5" y="122.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">TX FIFO</text>
<text x="662.5" y="136.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">4 deep, packed</text>
<text x="662.5" y="150.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">263 FIFO bytes,</text>
<text x="662.5" y="164.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">K28.5 commas</text>
<text x="662.5" y="178.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">bracket the frame</text>
<circle cx="601" cy="98" r="11" fill="#1f4e79"/><text x="601.0" y="102.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">4</text>
<line x1="557" y1="155.0" x2="583" y2="155.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="768" y="82" width="155" height="132" rx="6" fill="#f4f8fc" stroke="#1f4e79" stroke-width="1.5"/>
<text x="845.5" y="122.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">perif serialiser</text>
<text x="845.5" y="136.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">TXCFG 0x00020010</text>
<text x="845.5" y="150.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">n = 3, 10.000 ns/bit</text>
<text x="845.5" y="164.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">= 100 Mbaud</text>
<circle cx="784" cy="98" r="11" fill="#1f4e79"/><text x="784.0" y="102.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">5</text>
<line x1="740" y1="155.0" x2="766" y2="155.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
<text x="833.5" y="232.0" font-size="11" text-anchor="end" font-weight="bold" font-style="normal" fill="#0072B2">210 symbols, 263 FIFO bytes, 21.04 us burst per frame</text>
<line x1="845.5" y1="214" x2="845.5" y2="266" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="768" y="268" width="155" height="44" rx="22" fill="#fff7e6" stroke="#E69F00" stroke-width="2"/>
<text x="845.5" y="287.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">loopback wire (ch0)</text>
<text x="845.5" y="301.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">5/6 ns modelled latency</text>
<rect x="20" y="364" width="920" height="288" rx="10" fill="#ffffff" stroke="#b04a00" stroke-width="2"/>
<text x="30.0" y="379.0" font-size="12" text-anchor="start" font-weight="bold" font-style="normal" fill="#b04a00">PRU1 (RX core, 300 MHz)</text>
<line x1="845.5" y1="312" x2="845.5" y2="388" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="768" y="388" width="155" height="132" rx="6" fill="#fdf3e6" stroke="#b04a00" stroke-width="1.5"/>
<text x="845.5" y="428.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">perif RX sampler</text>
<text x="845.5" y="442.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">RXCFG 0x0000801F</text>
<text x="845.5" y="456.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">fractional divider 1.5</text>
<text x="845.5" y="470.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">5.000 ns samples =</text>
<text x="845.5" y="484.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">exact 2x oversampling</text>
<circle cx="784" cy="404" r="11" fill="#b04a00"/><text x="784.0" y="408.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">6</text>
<rect x="585" y="388" width="155" height="132" rx="6" fill="#fdf3e6" stroke="#b04a00" stroke-width="1.5"/>
<text x="662.5" y="428.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">realtime capture</text>
<text x="662.5" y="442.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">raw samples to DRAM1</text>
<text x="662.5" y="456.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">8 cycles per byte in</text>
<text x="662.5" y="470.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">a 12-cycle budget</text>
<circle cx="601" cy="404" r="11" fill="#b04a00"/><text x="601.0" y="408.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">7</text>
<line x1="766" y1="461.0" x2="742" y2="461.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="402" y="388" width="155" height="132" rx="6" fill="#fdf3e6" stroke="#b04a00" stroke-width="1.5"/>
<text x="479.5" y="428.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">post-frame (1)</text>
<text x="479.5" y="442.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">comma alignment,</text>
<text x="479.5" y="456.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">2:1 decimation,</text>
<text x="479.5" y="470.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">8b/10b decode</text>
<circle cx="418" cy="404" r="11" fill="#b04a00"/><text x="418.0" y="408.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">8</text>
<line x1="583" y1="461.0" x2="559" y2="461.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="219" y="388" width="155" height="132" rx="6" fill="#fdf3e6" stroke="#b04a00" stroke-width="1.5"/>
<text x="296.5" y="428.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">post-frame (2)</text>
<text x="296.5" y="442.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">CRC-32 check,</text>
<text x="296.5" y="456.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">PRNG bit-error</text>
<text x="296.5" y="470.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">check</text>
<circle cx="235" cy="404" r="11" fill="#b04a00"/><text x="235.0" y="408.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">9</text>
<line x1="400" y1="461.0" x2="376" y2="461.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="36" y="388" width="155" height="132" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
<text x="113.5" y="428.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">stats block</text>
<text x="113.5" y="442.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">DRAM1: frames, crc_ok,</text>
<text x="113.5" y="456.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">symbol_errors, bit_err,</text>
<text x="113.5" y="470.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">tot_bits, eof_status</text>
<circle cx="52" cy="404" r="11" fill="#2e7d32"/><text x="52.0" y="408.0" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">10</text>
<line x1="217" y1="461.0" x2="193" y2="461.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="159" y="540" width="458" height="64" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="388.0" y="560.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">Fast RX variant (same capture loop)</text>
<text x="388.0" y="574.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">LUT decimation, 4 bytes per load</text>
<text x="388.0" y="588.0" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">post-frame 44469 -&gt; 14905 cycles</text>
<line x1="388.0" y1="540" x2="388.0" y2="524" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="30.0" y="680.0" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#555555">Step numbers 1-10 follow the data; PRU1 flow runs right to left.</text>
</svg>
